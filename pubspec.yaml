name: kana_master
description: "Simple app to learn basics of japanese language."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.0+10

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Router
  go_router: ^18.0.2
  # DI
  injectable: ^3.0.0
  get_it: ^9.2.0
  # Bloc
  flutter_bloc: ^9.1.1
  # Database
  sqflite: ^2.4.2
  # Image management
  image: ^4.7.2
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.6.0
  file_picker: ^13.1.0
  csv: ^8.0.0
  # Charts
  fl_chart: ^1.1.1
  # CNN model
  tflite_flutter: ^0.12.1
  # SVG stroke order
  flutter_svg: ^2.2.3
  path_drawing: ^1.0.1
  xml: ^7.0.1
  # i18n
  slang: ^4.12.1
  slang_flutter: ^4.12.1
  # Income
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  cupertino_icons: ^2.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  app_tracking_transparency: ^2.0.7
  # N5 exam listening
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  injectable_generator: ^3.1.3

  # App icon
  flutter_launcher_icons: ^0.14.4

  # Splash screen
  #flutter_native_splash: ^2.4.7

  # Change app package name
  change_app_package_name: ^1.4.0 # flutter pub run change_app_package_name:main com.agasco.kanamaster

flutter_icons:
  android: "kana_master"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: true

  #color: "#000000"
  background_image: "assets/splash/background.png"
  image: "assets/splash/splash_white_640.png"
  branding: "assets/splash/cidenaris_logo.png"

  branding_bottom_padding_ios: 35

  android_12:
    color: "#000000"
    image: "assets/splash/splash_white_1200.png"
    branding: "assets/splash/cidenaris_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/svg/hiragana/
    - assets/svg/katakana/
    - assets/svg/kanji/
    - assets/i18n/
    - assets/csv/kanji_data.csv
    - assets/models/hiragana.tflite
    - assets/models/katakana.tflite
    - assets/models/kanji.tflite
    - assets/exam/bank/
    - assets/exam/audio/
